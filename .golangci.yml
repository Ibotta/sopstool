version: "2"
linters:
  default: none
  enable:
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
    - whitespace
  settings:
    staticcheck:
      checks: ["all", "-ST1005"] # existing user-facing messages are capitalized
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
